<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fábrica · Singular Wardrobe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#f4f1ec; --panel:#ffffff; --ink:#1d1b18; --muted:#6f6a62; --line:#e3ddd3;
    --pendiente:#c47f17; --pendiente-bg:#fdf3e1;
    --sin_stock:#8a8a8a; --sin_stock-bg:#eeeeee;
    --cortar:#2563a8; --cortar-bg:#e6effa;
    --estampar:#7a4fb3; --estampar-bg:#f1eafb;
    --empaquetar:#0f7f86; --empaquetar-bg:#e0f3f4;
    --producido:#1f7a4d; --producido-bg:#e3f4ea;
    --urg:#d12f2f; --urg-bg:#fff0ee;
    --err:#b3261e; --err-bg:#fbe9e7; --accent:#1d1b18;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;cursor:pointer}
  .hidden{display:none!important}

  #login{min-height:100vh;display:grid;place-items:center;padding:16px}
  #login form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(380px,100%);display:grid;gap:12px}
  #login h1{margin:0 0 4px;font-size:22px}
  #login input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
  #login button{padding:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
  #loginErr{color:var(--err);min-height:1.2em;font-size:14px}

  #avisoError{background:#c62828;color:#fff;padding:12px 16px;font-weight:800;font-size:20px;text-align:center;letter-spacing:.5px}
  #avisoError small{display:block;font-size:13px;font-weight:500;opacity:.9;letter-spacing:0}
  #aviso{background:#fff4c2;border-bottom:1px solid #e6d27a;padding:8px 16px;font-weight:600;font-size:14px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:grid;gap:10px}
  .fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .marca{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin-right:auto}
  .vistas{display:flex;background:var(--line);border-radius:12px;padding:3px}
  .vistas button{border:0;background:none;border-radius:9px;padding:9px 16px;font-weight:700;color:var(--muted)}
  .vistas button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px #0002}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
  .tab b{background:var(--line);border-radius:999px;padding:1px 9px;font-size:13px}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab.on b{background:#ffffff33}
  .tab .u{background:var(--urg);color:#fff;border-radius:999px;padding:1px 7px;font-size:12px}
  #buscar,#fFecha{padding:9px 14px;border:1px solid var(--line);border-radius:999px;font:inherit;background:var(--panel)}
  #buscar{width:190px}
  .btn-sec{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px}

  /* tarjetas */
  #lista{padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));align-items:start}
  .vacio{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;border-left:6px solid var(--c,var(--pendiente))}
  .card.urgente{background:var(--urg-bg);border-color:#f3b8b0;border-left-color:var(--urg)}
  .card.cancelado,.card.fuera{opacity:.55}
  .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .num{font-size:22px;font-weight:800}
  .fecha{color:var(--muted);font-size:14px}
  .dias{font-size:12px;font-weight:700;color:var(--err)}
  .badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:6px;padding:3px 8px;background:var(--line)}
  .b-urg{background:var(--urg);color:#fff}
  .b-ret{background:#7a1010;color:#fff}
  .b-err{background:var(--err-bg);color:var(--err)}
  .chip{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:5px;padding:2px 6px;color:var(--c);background:var(--cb);white-space:nowrap}
  .cliente{font-size:14px;color:var(--muted)}
  .lineas{display:grid;gap:8px}
  .linea{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
  .linea img,.linea .ph{width:52px;height:64px;object-fit:cover;border-radius:8px;background:var(--line)}
  .linea .t{font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .linea .v{color:var(--muted);font-size:14px}
  .talla{display:inline-block;margin-top:4px;border:2px solid var(--ink);border-radius:7px;padding:2px 9px;font-weight:800;font-size:16px;letter-spacing:.02em}
  .talla.sin{border-style:dashed;border-color:var(--line);color:var(--muted);font-weight:600;font-size:13px}
  .resto{color:var(--muted);font-size:14px;margin-left:6px}
  .pers{margin-top:4px;background:#1d1b18;color:#fff;border-radius:8px;padding:6px 10px;font-size:17px;font-weight:700;display:inline-block}
  .pers span{opacity:.7;font-weight:500;font-size:13px;margin-right:6px}
  .nota{background:#fff8e6;border:1px dashed #e0c27a;border-radius:8px;padding:8px 10px;font-size:14px}
  .err{background:var(--err-bg);color:var(--err);border-radius:8px;padding:8px 10px;font-size:14px}
  .acciones{display:flex;gap:8px}
  .acciones button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 10px;font-weight:700;flex:1}
  .acciones button.atras{flex:0 0 52px;font-size:18px}
  .acciones button.sec{flex:0.8}
  .acciones button.go{background:var(--c);border-color:var(--c);color:#fff;flex:1.6;font-size:16px}
  .acciones button[disabled]{opacity:.6;cursor:wait}
  .otros{display:grid;gap:8px}
  .otros-f{display:flex;gap:8px;flex-wrap:wrap}
  .otros-f input{flex:1;min-width:200px;font:inherit;padding:12px;border:2px solid var(--line);border-radius:10px}
  .otros-f button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;font-weight:700}
  .otros-f button.go{background:var(--c);border-color:var(--c);color:#fff}
  .acciones .otrosb{flex:1}
  .hecho .entregar{background:var(--producido);border-color:var(--producido);color:#fff;padding:12px 16px;font-weight:800}
  .card.entregado{opacity:.6}
  .card.ajeno{opacity:.55;filter:grayscale(.6)}
  #subbar{padding:10px 16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #subbar.hidden{display:none}
  #subbar button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:600}
  #subbar button.on{background:#1f1f1f;color:#fff;border-color:#1f1f1f}
  #subbar button.coger{background:#1b7f4b;color:#fff;border-color:#1b7f4b;margin-left:auto}
  .asig{display:flex;gap:8px;align-items:center;font-size:14px}
  .asig b{flex:1}
  .asig button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:600}
  .acciones button.coger{background:#1b7f4b;border-color:#1b7f4b;color:#fff;flex:2;font-size:16px}
  #quien{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  #quien.hidden{display:none}
  #quien .caja{background:var(--panel);border-radius:16px;padding:20px;max-width:420px;width:100%;display:grid;gap:12px}
  #quien .nombres{display:flex;flex-wrap:wrap;gap:8px}
  #quien .nombres button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:12px 18px;font-weight:700;font-size:16px}
  #quien form{display:flex;gap:8px} #quien input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px}
  #quien form button{border:0;background:#1b7f4b;color:#fff;border-radius:10px;padding:10px 16px;font-weight:700}
  .hecho{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
  .check{font-weight:700;color:var(--producido)}
  .nocheck{font-weight:700;color:var(--pendiente)}
  .hecho button{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;font-weight:600}

  /* resumen */
  #resumen{padding:16px 16px 110px;display:grid;gap:12px;max-width:1100px}
  #historico{padding:16px 16px 60px;display:grid;gap:14px}
  #ayuda{padding:16px 16px 80px}
  .aybarra{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg,#f4f1ec);padding:8px 0 12px;max-width:860px;margin:0 auto}
  .aybarra input{flex:1;min-width:220px;padding:11px 16px;border:1px solid var(--line);border-radius:999px;font:inherit;font-size:16px;background:var(--panel);color:inherit}
  .aybarra .cuenta{color:var(--muted);font-size:14px}
  .aybarra button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 14px;font-weight:600}
  .manual{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 28px 28px;line-height:1.55;font-size:16px}
  .manual h1{font-size:26px;margin:20px 0 6px}
  .manual h2{font-size:21px;margin:30px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
  .manual h3{font-size:17px;margin:20px 0 6px}
  .manual p{margin:8px 0}
  .manual ul,.manual ol{margin:8px 0;padding-left:24px}
  .manual li{margin:4px 0}
  .manual table{width:100%;border-collapse:collapse;margin:12px 0;font-size:15px}
  .manual th{text-align:left;background:#1f1f1f;color:#fff;padding:8px 10px}
  .manual td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
  .manual td:first-child{font-weight:600;width:34%}
  .manual figure{margin:14px 0}.manual figure img{width:100%;height:auto;display:block}
  .manual mark{background:#ffe066;color:#000;border-radius:3px;padding:0 1px}
  .manual .indice{columns:2;column-gap:24px;margin:10px 0 0;padding-left:20px}
  .manual .indice button{background:none;border:0;padding:2px 0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;text-align:left}
  .manual .nada{color:var(--muted);padding:30px 0;text-align:center}
  @media (max-width:640px){ .manual{padding:4px 16px 20px} .manual .indice{columns:1} }
  .hfiltros{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .hfiltros label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
  .hfiltros input,.hfiltros select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--panel);color:inherit}
  .hfiltros .rapidos{display:flex;gap:6px;flex-wrap:wrap}
  .hfiltros .rapidos button,.hacc button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 12px;font-weight:600}
  .hacc{display:flex;gap:8px;margin-left:auto}
  .hacc button.prim{background:#1f1f1f;color:#fff;border-color:#1f1f1f}
  .hres{display:flex;flex-wrap:wrap;gap:8px}
  .hres .pc{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--panel);font-size:14px}
  .hres .pc b{font-size:16px}
  .htabla{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
  .htabla th{background:#1f1f1f;color:#fff;text-align:left;padding:8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
  .htabla td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
  .htabla td.hnum{font-weight:800;white-space:nowrap;font-size:15px}
  .htabla .pr{white-space:nowrap}
  .htabla .ps{font-weight:800}
  .htabla .quien{font-weight:700}
  .htabla small{color:var(--muted);display:block}
  .hwrap{overflow-x:auto}
  .rtitulo{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .rtitulo h2{margin:0;font-size:22px}
  .rtitulo .tot{color:var(--muted)}
  .grupo{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .grupo.urgente{border-color:#f3b8b0}
  .ghead{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#faf8f5}
  .grupo.urgente .ghead{background:var(--urg-bg)}
  .ghead .gn{font-size:18px;font-weight:800;flex:1}
  .ghead .gq{font-size:26px;font-weight:800;min-width:60px;text-align:right}
  .ghead .gq small{font-size:13px;color:var(--muted);font-weight:600}
  .rrow{display:grid;grid-template-columns:36px minmax(150px,auto) 1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
  .rhacer{display:flex;gap:6px;align-items:center}
  .rhacer input{width:72px;font:inherit;font-size:18px;font-weight:700;text-align:center;padding:8px 6px;border:2px solid var(--line);border-radius:9px}
  .rhacer input:focus{outline:none;border-color:var(--ink)}
  .rhacer button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;background:var(--c,var(--ink));color:#fff;white-space:nowrap}
  .rhacer button[disabled]{opacity:.5}
  .retapas{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:320px}
  .retapas .chip{font-size:12px;padding:4px 8px}
  .rhacer .todos{background:#fff;color:var(--cortar);border:2px solid var(--cortar);padding:9px 12px}
  .rhacer .menos{background:#fff;color:var(--ink);border:1px solid var(--line);padding:10px 10px}
  .rq .rqd{font-size:11px;font-weight:600;color:var(--muted);line-height:1.2;text-align:right}
  .rrow .rpers{justify-self:start;background:#1d1b18;color:#fff;border-radius:9px;padding:6px 14px;font-size:24px;font-weight:800;letter-spacing:.06em;white-space:pre-wrap;word-break:break-word}
  .rrow .rpers small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;opacity:.65;text-transform:uppercase}
  .rrow .rpers.vacia{background:none;color:var(--muted);font-size:14px;font-weight:500;letter-spacing:0;padding:0}
  .rrow .runit{font-size:12px;color:var(--muted);font-weight:700}
  .rrow:first-of-type{border-top:0}
  .rrow.urg{background:var(--urg-bg)}
  .rrow .rv{font-weight:700}
  .rrow .rp{font-size:13px;color:var(--muted)}
  .rrow .rq{font-size:20px;font-weight:800;min-width:48px;text-align:right}
  input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
  #barra{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #barra .sel{font-weight:700;margin-right:auto}
  #barra button{border:0;border-radius:10px;padding:12px 16px;font-weight:700}
  #barra .go{background:#fff;color:var(--ink)}
  #barra .sec{background:#ffffff22;color:#fff}

  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;max-width:90vw;z-index:20;box-shadow:0 4px 16px #0003}
  #toast.e{background:var(--err)}

  #zonaImpresion{display:none}
  @media print{
    @page{margin:8mm}
    body.imp-etiqueta *{visibility:hidden}
    body.imp-etiqueta #zonaImpresion,body.imp-etiqueta #zonaImpresion *{visibility:visible}
    body.imp-etiqueta #zonaImpresion{display:block;position:absolute;inset:0}
    body.imp-etiqueta #zonaImpresion img{width:100%;display:block;page-break-after:always}
    body.imp-lista header,body.imp-lista #subbar,body.imp-lista #aviso,body.imp-lista #avisoError,body.imp-lista #barra,body.imp-lista #toast,body.imp-lista #lista,body.imp-lista input[type=checkbox]{display:none!important}
    body.imp-lista{background:#fff}
    body.imp-hist header,body.imp-hist #subbar,body.imp-hist #aviso,body.imp-hist #avisoError,body.imp-hist #barra,body.imp-hist #toast,body.imp-hist #lista,body.imp-hist #resumen,body.imp-hist .hfiltros{display:none!important}
    body.imp-hist,html:has(body.imp-hist){background:#fff!important}
    body.imp-ayuda header,body.imp-ayuda #subbar,body.imp-ayuda #aviso,body.imp-ayuda #avisoError,body.imp-ayuda #barra,body.imp-ayuda #toast,body.imp-ayuda #lista,body.imp-ayuda #resumen,body.imp-ayuda #historico,body.imp-ayuda .aybarra,body.imp-ayuda .indice-bloque{display:none!important}
    body.imp-ayuda,html:has(body.imp-ayuda){background:#fff!important}
    body.imp-ayuda #ayuda{padding:0}
    body.imp-ayuda .manual{border:0;padding:0;max-width:none;font-size:11pt}
    body.imp-ayuda .manual h2{break-after:avoid}
    body.imp-ayuda .manual tr,body.imp-ayuda .manual figure{break-inside:avoid}
    body.imp-ayuda .manual th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body.imp-ayuda .manual mark{background:none;padding:0}
    @page{margin:10mm}
    body.imp-hist #historico{padding:0}
    body.imp-hist .htabla{font-size:10px;border:1px solid #999}
    body.imp-hist .htabla th{background:#000!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:static}
    body.imp-hist .htabla tr{break-inside:avoid}
    body.imp-hist .hwrap{overflow:visible}
    body.imp-hist .himpcab{display:block!important}
    body.imp-lista .rrow{grid-template-columns:minmax(150px,auto) 1fr auto}
    body.imp-lista .rhacer{display:none!important}
    body.imp-lista .rrow .rpers{background:none;color:#000;border:2px solid #000}
    body.imp-lista .grupo{break-inside:avoid}
  }
  @media (max-width:640px){
    .rrow{grid-template-columns:36px 1fr auto auto;grid-template-areas:"c t h q" "c p p p"}
    .rrow > input{grid-area:c} .rrow > div:nth-of-type(1){grid-area:t} .rrow > div:nth-of-type(2){grid-area:p} .rrow > .rhacer{grid-area:h} .rrow > .rq{grid-area:q}
    .rhacer input{width:56px}
  }
  @media (max-width:440px){ #lista{grid-template-columns:1fr;padding:12px} #buscar{width:100%} #resumen{padding:12px 12px 130px} }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form id="fLogin">
    <h1>Fábrica · Singular Wardrobe</h1>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
    <div id="loginErr"></div>
  </form>
</section>

<section id="app" class="hidden">
  <div id="avisoError" class="hidden"></div>
  <div id="aviso" class="hidden"></div>
  <header>
    <div class="fila">
      <div class="marca">Singular Wardrobe · Fábrica</div>
      <div class="vistas"><button data-vista="pedidos" class="on">Pedidos</button><button data-vista="resumen">Resumen producción</button><button data-vista="historico">Histórico</button><button data-vista="ayuda">Ayuda</button></div>
      <button class="btn-sec" id="bImportar" title="Traer ahora los pedidos nuevos de Shopify">↻ Importar</button>
      <button class="btn-sec" id="bSalir">Salir</button>
    </div>
    <div class="fila">
      <div class="tabs" id="tabs"></div>
      <input id="buscar" placeholder="Buscar nº pedido o nombre">
      <select id="fFecha" class="hidden" title="Filtrar por fecha de entrada">
        <option value="todos">Todos los días</option>
        <option value="atrasados">Hasta ayer (atrasados)</option>
        <option value="hoy">Solo entrados hoy</option>
      </select>
    </div>
  </header>
  <div id="subbar" class="hidden"></div>
  <main id="lista"></main>
  <main id="resumen" class="hidden"></main>
  <main id="historico" class="hidden"></main>
  <main id="ayuda" class="hidden"></main>
  <div id="barra" class="hidden"></div>
</section>

<div id="quien" class="hidden"><div class="caja">
  <h3 style="margin:0" id="quienTit">¿Para quién?</h3>
  <div class="nombres" id="quienLista"></div>
  <button type="button" id="quienNadie" class="btn-sec hidden">Sin indicar</button>

// Importación diaria de Shopify a las 8:00. A partir de las 8:15, si hoy no hay una importación correcta → aviso rojo.
async function comprobarImportacion(){
  const el = $("#avisoError");
  let error = null;
  const ahora = new Date(), hoy = new Date(ahora); hoy.setHours(0, 0, 0, 0);
  if (DEMO){
    if (new URLSearchParams(location.search).has("errorimport")) error = "Shopify: demo de fallo";
  } else if (ahora.getHours() * 60 + ahora.getMinutes() >= 8 * 60 + 15){
    const { data, error: e } = await sb.from("fab_eventos").select("tipo, created_at, detalle")
      .in("tipo", ["importacion", "importacion_error"]).gte("created_at", hoy.toISOString()).order("created_at", { ascending: false }).limit(20);
    if (!e){
      const okHoy = (data ?? []).some((x) => x.tipo === "importacion");
      if (!okHoy) error = (data ?? []).find((x) => x.tipo === "importacion_error")?.detalle?.error ?? "la importación de las 8:00 no se ha hecho";
    }
  }
  el.innerHTML = error ? `⚠ ERROR: no actualizado hoy<small>${esc(String(error).slice(0, 200))} · Pulsa «Importar» para reintentar</small>` : "";
  el.classList.toggle("hidden", !error);
}

    if (r.error){ toast("Error cargando pedidos: " + r.error.message, true); return; }
    data = r.data; c = cc;
  }
  pedidos = data.map((p) => ({ ...p, recogida: p.recogida ?? !p.direccion1 }));
  for (const p of pedidos){ p._estado = estadoPedido(p); p._urg = urgente(p); }
  pedidos.sort(porPrioridad);
  cfg = Object.fromEntries((c.data ?? []).map((r) => [r.clave, r.valor]));
  const avisos = [];
  if (DEMO) avisos.push("DEMOSTRACIÓN con pedidos ficticios: no se conecta a Shopify ni a GLS.");
  else {
    if (cfg.gls_modo !== "real") avisos.push("MODO PRUEBAS: las etiquetas GLS son de prueba y no sirven para enviar.");
    if (cfg.shopify_crear_envio !== "si") avisos.push("Shopify no se actualiza todavía (envío al cliente desactivado).");
  }
  comprobarImportacion();
  $("#aviso").textContent = avisos.join("  ·  ");
  $("#aviso").classList.toggle("hidden", !avisos.length);
  pintar();
}

async function moverLineas(ids, estado, msg){
  if (!ids.length) return;
  const set = new Set(ids);
  const uds = pedidos.flatMap((p) => p.fab_lineas ?? []).filter((l) => set.has(l.line_id)).reduce((s, l) => s + (l.cantidad ?? 1), 0);
  const j = await fn({ accion: "lineas", line_ids: ids, estado });
  if (!j.ok) toast(j.error || "Error", true); else toast(msg || `${uds} prenda${uds > 1 ? "s" : ""} → ${ETAPA[estado].label}`);
  sel.clear(); await cargar();
}
function moverPedido(id, desde, hacia){
  const p = pedidos.find((x) => x.order_id === id);
  return moverLineas(p.fab_lineas.filter((l) => (l.estado ?? "pendiente") === desde).map((l) => l.line_id), hacia);
}

async function empaquetado(id){
  if (ocupado.has(id)) return;
  const pz = pedidos.find((x) => x.order_id === id);
  if (pz && destinoOtros(pz)){ toast(`${destinoOtros(pz)}: va por Otros envíos, no por GLS`); return; }
  ocupado.add(id); pintar();
  try {
    const j = await fn({ accion: "producido", order_id: id });
    if (!j.ok){ toast(j.error || "Error", true); return; }
    if (j.recogida){ toast("Listo para recoger en taller"); return; }
    if (!j.pdf){ toast("Etiqueta creada en GLS pero sin PDF. Usa Reimprimir.", true); return; }
    await imprimirPdf(j.pdf);
    await fn({ accion: "impresa", order_id: id });
    toast("Etiqueta impresa · GLS " + j.codbarras + (j.shopify && j.shopify.startsWith("error") ? " · ⚠ Shopify: " + j.shopify : ""));
  } catch (e){ toast(String(e.message || e), true); }
  finally { ocupado.delete(id); await cargar(); }
}

async function marcarPersona(ids, tipo, persona){
  if (DEMO){
    // en la BD lo hace el trigger fab_registro_personas: al acabar la etapa el pedido queda libre
    for (const id of ids){ const p = Demo.pedidos.find((x) => x.order_id === id); if (!p) continue; p[tipo + "_por"] = persona || null; p[tipo + "_at"] = p[tipo + "_at"] || new Date().toISOString(); p.asignado_a = null; p.asignado_at = null; }
    return;
  }
  const { error } = await sb.rpc("fab_marcar_persona", { p_order_ids: ids, p_tipo: tipo, p_persona: persona || null });
  if (error) toast("No se ha guardado quién lo ha hecho: " + error.message, true);
}
// Pide la persona (si no hay una fija arriba). Al estampar vale la que lo tiene cogido; al empaquetar siempre se pregunta.
// Al acabar cada etapa el pedido vuelve a quedar LIBRE (estampa una persona, empaqueta otra).
function preguntarQuien(p, tipo, accion){
  if (persona()) return accion(persona());
  if (tipo === "estampado" && p.asignado_a) return accion(p.asignado_a);
  trasElegir = accion;
  abrirQuien(`¿Quién lo ha ${tipo}? · ${p.order_name}`, { nadie: true, destacar: p.asignado_a });
}
async function estampar(id, desde){
  const p = pedidos.find((x) => x.order_id === id); if (!p) return;
  preguntarQuien(p, "estampado", async (per) => { await moverPedido(id, desde, "empaquetar"); await marcarPersona([id], "estampado", per); if (DEMO) await cargar(); });
}
async function empaquetarCon(id){
  const p = pedidos.find((x) => x.order_id === id); if (!p) return;
  preguntarQuien(p, "empaquetado", async (per) => {
    await empaquetado(id);
    if (pedidos.find((x) => x.order_id === id)?._estado === "producido"){ await marcarPersona([id], "empaquetado", per); await cargar(); }
  });
}
async function otrosCon(id, info){

    await otroEnvio(id, info, true);

}

// PDF de GLS → imágenes → impresión. En el PC de fábrica: Chrome con --kiosk-printing para imprimir sin diálogo.
async function imprimirPdf(b64){
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
  const zona = $("#zonaImpresion"); zona.innerHTML = "";
  for (let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale: 3 });
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    const img = new Image(); img.src = canvas.toDataURL("image/png"); await img.decode();
    zona.appendChild(img);
  }
  imprimir("imp-etiqueta");
}
function imprimir(modo){
  document.body.classList.add(modo);
  const fin = () => { document.body.classList.remove(modo); window.removeEventListener("afterprint", fin); };
  window.addEventListener("afterprint", fin);
  window.print(); setTimeout(fin, 1000);
}

function pintarPedidos(){
  pintarSubbar();
  $("#barra").classList.add("hidden");
  const q = $("#buscar").value.trim().toLowerCase();
  const filtrados = pedidos.filter((p) => !q || p.order_name.toLowerCase().includes(q) || (p.cliente_nombre ?? "").toLowerCase().includes(q));
  $("#tabs").innerHTML = TABS.map((t) => {
    const ps = filtrados.filter(t.f).filter(t.cuenta ?? (() => true)); const u = ps.filter((p) => p._urg).length;
    if (t.id === "pendiente" && !ps.length && tab !== "pendiente") return "";
    return `<button class="tab ${t.id === tab ? "on" : ""}" data-tab="${t.id}">${t.label} <b>${ps.length}</b>${u && !["todos", "producido", "otros", "sin_etiqueta", "recogida", "listos", "recogidos", "retrasados"].includes(t.id) ? `<span class="u">${u} urg</span>` : ""}</button>`;
  }).join("");
  let lista = listaActual(filtrados, true);

  if (tab === "recogida") lista = lista.slice().sort((a, b) => rangoRec(a) - rangoRec(b) || (rangoRec(a) === 2 ? new Date(b.entregado_at) - new Date(a.entregado_at) : porPrioridad(a, b)));
  if (tab === "recogidos") lista = lista.slice().sort((a, b) => new Date(b.entregado_at) - new Date(a.entregado_at));

function lineasEnEtapa(etapa){
  const f = $("#fFecha").value, out = [];
  for (const p of pedidos){
    if (!activo(p) || p._estado === "producido") continue;
    if (f === "hoy" && !esHoy(p.creado_shopify)) continue;
    if (f === "atrasados" && esHoy(p.creado_shopify)) continue;
    for (const l of p.fab_lineas ?? []) if (etapa === "todos" || (l.estado ?? "pendiente") === etapa) out.push({ ...l, p });
  }
  return out;
}

// Agrupa las prendas de una etapa: modelo → talla+color; personalizadas una a una
function construirResumen(etapa){
  const ls = lineasEnEtapa(etapa);
  const grupos = new Map();
  for (const l of ls){
    if (!grupos.has(l.titulo)) grupos.set(l.titulo, { titulo: l.titulo, filas: new Map(), uds: 0, urg: 0, antiguo: l.p.creado_shopify });
    const g = grupos.get(l.titulo); g.uds += l.cantidad; if (l.p._urg) g.urg += l.cantidad;
    if (l.p.creado_shopify < g.antiguo) g.antiguo = l.p.creado_shopify;
    const pers = textoPers(l);
    const v = partes(l.variante);
    if (pers){ // una línea por prenda personalizada (si la línea trae 2 uds, salen 2 filas)
      for (let u = 1; u <= l.cantidad; u++)
        g.filas.set(`p:${l.line_id}:${u}`, { talla: v.talla, resto: v.resto, pers, persKey: (l.personalizacion ?? []).map((x) => x.key).join(" · "),
          ids: [l.line_id], uds: 1, unidad: l.cantidad > 1 ? `${u} de ${l.cantidad}` : null, urg: l.p._urg, pedidos: [l.p], nota: l.p.nota ?? "",
          porEtapa: { [l.estado ?? "pendiente"]: 1 } });
      continue;
    }
    const key = `v:${l.variante ?? ""}`;
    if (!g.filas.has(key)) g.filas.set(key, { talla: v.talla, resto: v.resto, pers: "", variante: l.variante ?? null, titulo: l.titulo, clave: l.titulo + "|" + (l.variante ?? ""), ids: [], uds: 0, urg: false, pedidos: [] });
    const fl = g.filas.get(key); fl.ids.push(l.line_id); fl.uds += l.cantidad; fl.urg ||= l.p._urg; fl.pedidos.push(l.p);
    fl.porEtapa ??= {}; const le = l.estado ?? "pendiente"; fl.porEtapa[le] = (fl.porEtapa[le] ?? 0) + l.cantidad;
  }
  const lista = [...grupos.values()].sort((a, b) => (b.urg > 0) - (a.urg > 0) || b.uds - a.uds);
  const contador = etapa === "cortar"; // en Cortar vinilo las genéricas llevan contador de cortadas
  let totalQuedan = 0;
  for (const g of lista){
    g.quedan = 0;
    for (const f of g.filas.values()){
      f.hechas = contador && !f.pers ? Math.min(cortados.get(f.clave) ?? 0, f.uds) : 0;
      f.quedan = f.uds - f.hechas; g.quedan += f.quedan;
    }
    totalQuedan += g.quedan;
    g.conPers = [...g.filas.values()].some((f) => f.pers);
    g.filas = [...g.filas.values()].sort((a, b) => (b.urg - a.urg) || (a.pers ? 1 : 0) - (b.pers ? 1 : 0) || rangoTalla(a.talla) - rangoTalla(b.talla) || String(a.resto).localeCompare(String(b.resto), "es"));
    for (const f of g.filas) f.pedidosOrd = [...new Set(f.pedidos)].sort(porPrioridad);
  }
  return { ls, lista, total: ls.reduce((s, l) => s + l.cantidad, 0), quedan: totalQuedan, contador };
}
// Marca como hechas N unidades de una fila del resumen: primero urgentes, luego las más antiguas.
let filasR = new Map();
async function hacerUnidades(k, n){
  const f = filasR.get(k); if (!f) return;
  const E = ETAPA[etapaR];
  if (f.pers){ // personalizada: se sabe el pedido → avanza esa prenda
    await moverLineas(f.ids, E.sig, `✔ ${f.pers} (${f.pedidosOrd[0]?.order_name ?? ""}) → ${ETAPA[E.sig].label}`);
    return;
  }
  // genérica: suma al contador; la BD (fab_autoasignar) pasa sola a Empaquetar los pedidos que quedan completos (urgentes y antiguos primero)
  n = Math.floor(Number(n));
  if (!n || n < 1){ toast("Escribe cuántos vinilos has cortado", true); return; }
  if (n > f.quedan) n = f.quedan;
  await sumarCortados(f, n, `${n} cortada${n > 1 ? "s" : ""} · ${f.titulo}${f.talla ? " T." + f.talla : ""} · quedan ${f.quedan - n}`);
}
async function sumarCortados(f, n, msg){
  let error = null;
  if (DEMO) Demo.sumarCortados(f.titulo, f.variante, n);
  else ({ error } = await sb.rpc("fab_sumar_cortados", { p_titulo: f.titulo, p_variante: f.variante, p_n: n }));
  if (error) toast(error.message, true); else toast(msg);
  await cargar();
}

// ───── Ayuda: el manual de uso (web/manual.md), con buscador por palabras e impresión en PDF ─────
// Regla: cada cambio del programa se añade a web/manual.md (y al manual en Claude Docs).
let manual = null, ayudaQ = "";
const sinAcentos = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function mdInline(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdHtml(md){
  const L = md.split("\n"), out = [];
  for (let i = 0; i < L.length;){
    const l = L[i];
    if (!l.trim()){ i++; continue; }
    let m;
    if ((m = l.match(/^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/))){ out.push(`<figure><img src="${esc(m[2])}" alt="${esc(m[1])}"></figure>`); i++; continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))){ out.push(`<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (l.startsWith("|")){
      const filas = []; while (i < L.length && L[i].startsWith("|")) filas.push(L[i++]);
      const celdas = (f) => f.replace(/^\||\|\s*$/g, "").split("|").map((c) => c.trim());
      const cuerpo = filas.slice(1).filter((f) => !/^\|\s*-/.test(f));
      out.push(`<table><thead><tr>${celdas(filas[0]).map((c) => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${cuerpo.map((f) => `<tr>${celdas(f).map((c) => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (/^\d+\.\s/.test(l)){ const it = []; while (i < L.length && /^\d+\.\s/.test(L[i])) it.push(L[i++].replace(/^\d+\.\s+/, "")); out.push(`<ol>${it.map((x) => `<li>${mdInline(x)}</li>`).join("")}</ol>`); continue; }
    if (/^-\s/.test(l)){ const it = []; while (i < L.length && /^-\s/.test(L[i])) it.push(L[i++].replace(/^-\s+/, "")); out.push(`<ul>${it.map((x) => `<li>${mdInline(x)}</li>`).join("")}</ul>`); continue; }
    const par = []; while (i < L.length && L[i].trim() && !/^(#|\||-\s|\d+\.\s|!\[)/.test(L[i])) par.push(L[i++]);
    out.push(`<p>${mdInline(par.join(" "))}</p>`);
  }
  return out.join("");
}
function textoPlano(md){ return md.replace(/!\[[^\]]*\]\([^)]*\)/g, "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/[*#|>-]/g, " ").replace(/\s+/g, " "); }
async function cargarManual(){
  try {
    const r = await fetch("manual.md", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const md = await r.text();
    const partes = md.split(/\n(?=## )/);
    const cab = partes.shift();
    const titulo = (cab.match(/^#\s+(.*)$/m) ?? [, "Manual de uso"])[1];
    manual = { titulo, intro: mdHtml(cab.replace(/^#\s+.*$/m, "")), secciones: partes.map((p, k) => {
      const t = p.match(/^##\s+(.*)$/m)[1];
      return { id: "ay-" + k, titulo: t, html: mdHtml(p), texto: sinAcentos(t + " " + textoPlano(p)) };
    }) };
  } catch (e){ manual = { error: String(e.message || e) }; }
}
function resaltar(raiz, palabras){
  if (!palabras.length) return;
  const nodos = []; const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
  while (w.nextNode()) nodos.push(w.currentNode);
  for (const n of nodos){
    const orig = n.nodeValue, norm = sinAcentos(orig);
    if (norm.length !== orig.length) continue;
    const marcas = [];
    for (const p of palabras){ let k = norm.indexOf(p); while (k >= 0){ marcas.push([k, k + p.length]); k = norm.indexOf(p, k + p.length); } }
    if (!marcas.length) continue;
    marcas.sort((a, b) => a[0] - b[0]);
    const frag = document.createDocumentFragment(); let pos = 0;
    for (const [a, b] of marcas){ if (a < pos) continue; frag.append(orig.slice(pos, a)); const mk = document.createElement("mark"); mk.textContent = orig.slice(a, b); frag.append(mk); pos = b; }
    frag.append(orig.slice(pos)); n.replaceWith(frag);
  }
}
